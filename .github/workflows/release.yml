name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach to a draft (leave empty for artifacts only)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Validate release source
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tag must use vMAJOR.MINOR.PATCH'
            }
            git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag must already exist' }
          } elseif ($env:GITHUB_REF -ne 'refs/heads/pro-win') {
            throw 'Manual installer builds without a release tag must run from pro-win'
          }
          git fetch origin pro-win
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the release branch' }
          git merge-base --is-ancestor HEAD origin/pro-win
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to pro-win; merge d-win first' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c 'from nodera import __version__; print(__version__)'
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match nodera.__version__' }
      - run: python -m venv .venv
      - run: .venv\Scripts\python -m pip install -e ".[dev]"
      - run: .venv\Scripts\python scripts/prepare_core.py
      - run: .venv\Scripts\python -m ruff check .
      - run: .venv\Scripts\python -m ruff format --check .
      - run: .venv\Scripts\python -m pytest -vv -x --durations=10
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check installer compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6.7+ must be preinstalled on the build runner' }
      - run: .\scripts\build.ps1 -Installer
      - name: Verify frozen installer without installing
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'nodera-installer-check.json'
          $process = Start-Process -FilePath '.\dist\installers\Nodera-Setup.exe' -ArgumentList @('--check-bundle', ('"' + $report + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Frozen installer verification timed out' }
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($process.ExitCode -ne 0) { throw 'Frozen installer verification failed' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'Frozen installer did not produce its verification report' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.pro_keys_present) { throw 'Installer resources are incomplete' }
          Copy-Item -LiteralPath $report -Destination '.\dist\installers\installer-check.json'
      - uses: actions/upload-artifact@v4
        with:
          name: Nodera-installer
          path: |
            dist/installers/Nodera-Setup.exe
            dist/installers/Nodera-Setup.exe.sha256
            dist/installers/installer-check.json
      - name: Create draft release for review
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $releaseArguments = @('release', 'create', $env:RELEASE_TAG, '--draft', '--verify-tag', '--title', "Nodera $env:RELEASE_TAG")
          if (Test-Path -LiteralPath $notes) {
            $releaseArguments += @('--notes-file', $notes)
          } else {
            $releaseArguments += '--generate-notes'
          }
          $releaseArguments += @('dist/installers/Nodera-Setup.exe', 'dist/installers/Nodera-Setup.exe.sha256')
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
